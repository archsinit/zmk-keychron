name: B1 Pro 071A native baseline build

on:
  push:
    branches:
      - b1pro-071a-native-baseline
    paths:
      - "app/**"
      - "0001-esb-nrf-fix.patch"
      - ".github/workflows/b1pro-native-baseline-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: docker.io/zmkfirmware/zmk-build-arm:3.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify native 071A target
        run: |
          grep -q 'CONFIG_USB_DEVICE_PID=0x071a' app/boards/shields/keychron/b1n/us/keychron_b1_usn.conf
          grep -q 'CONFIG_BT_DIS_FW_REV_STR="v1.0.2"' app/boards/shields/keychron/b1n/us/keychron_b1_usn.conf
          grep -q 'CONFIG_BT_DIS_HW_REV_STR="v1.0.1"' app/boards/shields/keychron/b1n/us/keychron_b1_usn.conf

      - name: Initialize workspace
        run: west init -l app

      - name: Update modules
        run: west update

      - name: Apply Keychron official Zephyr patch
        run: |
          git -C zephyr am ../0001-esb-nrf-fix.patch
          grep -q "usb_sof_count" zephyr/drivers/usb/device/usb_dc_nrfx.c
          grep -q "CONFIG_DYNAMIC_DIRECT_INTERRUPTS" zephyr/subsys/bluetooth/controller/ll_sw/nordic/lll/lll.c
          grep -q "bt_bas_set_battery_level_fix" zephyr/subsys/bluetooth/services/bas.c

      - name: Export Zephyr CMake package
        run: west zephyr-export

      - name: Build native Keychron B1 Pro 071A target
        run: west build -s app -p -b keychron -- -DSHIELD=keychron_b1_usn

      - name: Upload native baseline diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: b1pro-071a-native-baseline-firmware
          path: |
            build/zephyr/zmk.uf2
            build/zephyr/zephyr.dts
            build/zephyr/.config
            build/zephyr/zephyr.map
